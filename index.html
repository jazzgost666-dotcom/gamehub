<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>NexusHub | Sincronização Forçada</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000; color: #00ff00; font-family: sans-serif; padding: 20px; }
        .box { border: 2px solid #00ff00; padding: 20px; border-radius: 10px; background: #050505; }
        .jogo-card { background: #111; border: 1px solid #333; padding: 15px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #00ff00; }
        input { background: #222; border: 1px solid #00ff00; color: #fff; padding: 12px; width: 60%; }
        button { padding: 12px; cursor: pointer; font-weight: bold; border: none; border-radius: 5px; }
        .btn-add { background: #00ff00; color: #000; }
        .btn-del { background: #ff4444; color: #fff; }
        .btn-edit { background: #0088ff; color: #fff; }
    </style>
</head>
<body>

<div class="box">
    <h1>🚀 NEXUSHUB ENGINE</h1>
    <p id="debug">Status: Verificando onde os jogos estão escondidos...</p>
    
    <div style="margin-bottom: 20px;">
        <input type="hidden" id="keyAtual">
        <input type="text" id="nomeJogo" placeholder="NOME DO JOGO NOVO">
        <button class="btn-add" onclick="forcarSalvar()">GRAVAR AGORA</button>
    </div>

    <div id="lista"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBZTuu5I2FNx4ky1UcVohro_Ri_yo3YQfs",
        databaseURL: "https://nexushub-b9667-default-rtdb.firebaseio.com",
        projectId: "nexushub-b9667",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. DESCOBRIR O CAMINHO (Onde o deletar funcionou)
    let caminhoEncontrado = "";

    db.ref('/').on('value', (snapshot) => {
        const listaDiv = document.getElementById('lista');
        listaDiv.innerHTML = "";
        const dados = snapshot.val();
        
        if (!dados) {
            document.getElementById('debug').innerText = "Banco vazio ou caminho errado.";
            return;
        }

        // Se os dados estão dentro de uma pasta, vamos usar essa pasta
        let jogosParaExibir = {};
        if (dados.jogos) {
            jogosParaExibir = dados.jogos;
            caminhoEncontrado = "jogos";
        } else {
            jogosParaExibir = dados;
            caminhoEncontrado = ""; // Raiz
        }

        document.getElementById('debug').innerText = "Conectado! Salvando em: /" + caminhoEncontrado;

        Object.keys(jogosParaExibir).forEach(id => {
            const jogo = jogosParaExibir[id];
            const nome = (typeof jogo === 'object') ? (jogo.nome || "Sem Nome") : jogo;
            
            listaDiv.innerHTML += `
                <div class="jogo-card">
                    <div><b>${nome}</b><br><small>${id}</small></div>
                    <div>
                        <button class="btn-edit" onclick="prepararEdicao('${id}', '${nome}')">✏️</button>
                        <button class="btn-del" onclick="apagar('${id}')">🗑️</button>
                    </div>
                </div>
            `;
        });
    });

    // 2. FUNÇÃO DE SALVAR "FORÇA BRUTA"
    window.forcarSalvar = function() {
        const nome = document.getElementById('nomeJogo').value;
        const idExistente = document.getElementById('keyAtual').value;

        if (!nome) return alert("Escreva o nome!");

        if (idExistente) {
            // EDITAR
            db.ref(caminhoEncontrado + '/' + idExistente).update({ nome: nome })
            .then(() => reset())
            .catch(e => {
                // Se falhar o update (porque era string), tenta o set
                db.ref(caminhoEncontrado + '/' + idExistente).set(nome);
                reset();
            });
        } else {
            // ADICIONAR NOVO (Tenta 2 caminhos)
            const novoRef = db.ref(caminhoEncontrado || 'jogos').push();
            novoRef.set({
                nome: nome,
                likes: 0
            }).then(() => {
                document.getElementById('nomeJogo').value = "";
                alert("ADICIONADO COM SUCESSO!");
            }).catch(err => {
                alert("ERRO: O chefe bloqueou novos jogos. Tente editar um que já existe!");
            });
        }
    }

    window.apagar = (id) => {
        if(confirm("Apagar?")) {
            db.ref(caminhoEncontrado + '/' + id).remove();
        }
    }

    window.prepararEdicao = (id, nome) => {
        document.getElementById('keyAtual').value = id;
        document.getElementById('nomeJogo').value = nome;
        window.scrollTo(0,0);
    }

    function reset() {
        document.getElementById('keyAtual').value = "";
        document.getElementById('nomeJogo').value = "";
    }
</script>
</body>
</html>
