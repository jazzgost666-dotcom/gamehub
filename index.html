<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>NEXUSHUB ADMIN | VERSÃO FIRESTORE</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        :root { --neon: #00ff88; --blue: #00d9ff; --red: #ff4d4d; }
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 550px; margin: auto; background: #111; border: 1px solid #333; padding: 25px; border-radius: 15px; box-shadow: 0 0 30px rgba(0,255,136,0.1); }
        h1 { color: var(--neon); text-align: center; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        input { background: #000; border: 1px solid #444; color: #fff; padding: 15px; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--neon); }
        .btn-main { background: var(--neon); color: #000; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 16px; }
        .btn-main:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--neon); }
        .game-card { background: #1a1a1a; padding: 15px; margin: 10px 0; border-radius: 10px; border-left: 5px solid var(--neon); display: flex; justify-content: space-between; align-items: center; }
        .game-info b { font-size: 18px; color: #fff; display: block; }
        .game-info span { color: #666; font-size: 11px; }
        .actions { display: flex; gap: 10px; }
        .btn-edit { background: var(--blue); color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
        .btn-del { background: var(--red); color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>NexusHub Admin</h1>
    <div class="input-group">
        <input type="hidden" id="editId">
        <input type="text" id="gameName" placeholder="NOME DO JOGO">
        <input type="text" id="postedBy" placeholder="POSTADO POR (SEU NOME)">
        <button class="btn-main" id="saveBtn" onclick="processarSalvar()">Gravar no Firestore</button>
    </div>
    <div id="displayList">Conectando ao Firestore...</div>
</div>

<script>
    // Configuração oficial do seu projeto GLS HUB
    const firebaseConfig = {
        apiKey: "AIzaSyCS1NBS0qrLiCpV_OSqpUKoipxzdGiUQ48",
        projectId: "glshub",
        authDomain: "glshub.firebaseapp.com",
        storageBucket: "glshub.firebasestorage.app",
        appId: "1:1020833468968:web:adb9e1e604ebcc1e98db1d"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(); // Mudado para Firestore

    // 1. LER JOGOS (Escuta em tempo real)
    db.collection('games').orderBy('data', 'desc').onSnapshot((snapshot) => {
        const list = document.getElementById('displayList');
        list.innerHTML = "";

        if (snapshot.empty) {
            list.innerHTML = "<p style='text-align:center; color:#555;'>Nenhum jogo no Firestore.</p>";
            return;
        }

        snapshot.forEach(doc => {
            const item = doc.data();
            const id = doc.id;
            const nomeVal = item.title || item.nome || "Sem título";
            const autor = item.author || item.autor || "Admin";

            list.innerHTML += `
                <div class="game-card">
                    <div class="game-info">
                        <b>${nomeVal}</b>
                        <span>Por: ${autor} | ID: ${id}</span>
                    </div>
                    <div class="actions">
                        <button class="btn-edit" onclick="prepararEdicao('${id}', '${nomeVal}', '${autor}')">✏️</button>
                        <button class="btn-del" onclick="remover('${id}')">🗑️</button>
                    </div>
                </div>
            `;
        });
    });

    // 2. SALVAR OU ATUALIZAR
    function processarSalvar() {
        const nome = document.getElementById('gameName').value;
        const autor = document.getElementById('postedBy').value;
        const id = document.getElementById('editId').value;

        if (!nome) return alert("Digite o nome do jogo!");

        const dadosParaEnviar = {
            title: nome, // Use 'title' para bater com seu site oficial
            author: autor || "Admin",
            likes: 0,
            data: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (id) {
            db.collection('games').doc(id).update(dadosParaEnviar)
                .then(() => { alert("ATUALIZADO!"); resetar(); })
                .catch(err => alert("Erro ao atualizar: " + err));
        } else {
            db.collection('games').add(dadosParaEnviar)
                .then(() => { alert("POSTADO!"); resetar(); })
                .catch(err => alert("Erro ao postar: " + err));
        }
    }

    window.remover = (id) => {
        if(confirm("Deseja apagar?")) {
            db.collection('games').doc(id).delete();
        }
    }

    window.prepararEdicao = (id, nome, autor) => {
        document.getElementById('editId').value = id;
        document.getElementById('gameName').value = nome;
        document.getElementById('postedBy').value = autor;
        document.getElementById('saveBtn').innerText = "Atualizar Agora";
        document.getElementById('saveBtn').style.background = "#00d9ff";
        window.scrollTo(0,0);
    }

    function resetar() {
        document.getElementById('editId').value = "";
        document.getElementById('gameName').value = "";
        document.getElementById('postedBy').value = "";
        document.getElementById('saveBtn').innerText = "Gravar no Firestore";
        document.getElementById('saveBtn').style.background = "#00ff88";
    }
</script>
</body>
</html>
