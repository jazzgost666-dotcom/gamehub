<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>NexusHub | PAINEL DE CONTROLE FINAL</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --cor-neon: #00ff88; --cor-bg: #050505; }
        body { background: var(--cor-bg); color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .admin-panel { max-width: 700px; margin: auto; background: #111; border: 2px solid #333; border-radius: 15px; padding: 25px; box-shadow: 0 0 20px rgba(0,255,136,0.1); }
        .header { border-bottom: 2px solid var(--cor-neon); margin-bottom: 20px; padding-bottom: 10px; text-align: center; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; background: #000; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 16px; }
        input:focus { border-color: var(--cor-neon); outline: none; }
        button { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-post { background: var(--cor-neon); color: #000; width: 100%; margin-top: 5px; }
        .game-card { background: #1a1a1a; padding: 20px; border-radius: 12px; margin: 15px 0; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .game-info b { font-size: 20px; color: var(--cor-neon); display: block; }
        .game-info span { color: #888; font-size: 13px; }
        .likes-count { background: #333; padding: 5px 10px; border-radius: 5px; color: #ffcc00; font-weight: bold; margin-top: 5px; display: inline-block; }
        .actions { display: flex; gap: 8px; }
        .btn-del { background: #ff4444; color: #fff; }
        .btn-edit { background: #0088ff; color: #fff; }
    </style>
</head>
<body>

<div class="admin-panel">
    <div class="header">
        <h1>🚀 NEXUSHUB ENGINE</h1>
        <p id="status">Status: Sincronizando com a Matrix...</p>
    </div>

    <div id="form-area">
        <input type="hidden" id="keyAtual">
        <input type="text" id="nomeJogo" placeholder="Nome do novo jogo ou edição...">
        <button class="btn-post" id="btnMain" onclick="salvarBruto()">GRAVAR NO BANCO DE DADOS</button>
    </div>

    <div id="listaJogos" style="margin-top: 30px;"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBZTuu5I2FNx4ky1UcVohro_Ri_yo3YQfs",
        databaseURL: "https://nexushub-b9667-default-rtdb.firebaseio.com",
        projectId: "nexushub-b9667",
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. LEITURA INTELIGENTE (Limpa o JSON feio)
    db.ref('/').on('value', (snapshot) => {
        const listDiv = document.getElementById('listaJogos');
        listDiv.innerHTML = "";
        const data = snapshot.val();
        document.getElementById('status').innerText = "Status: CONECTADO ✅";

        if (!data) {
            listDiv.innerHTML = "<p style='text-align:center; color:#666;'>O banco de dados está vazio.</p>";
            return;
        }

        // Filtra se os dados estão na pasta 'jogos' ou na raiz
        const root = data.jogos ? data.jogos : data;
        const prefix = data.jogos ? 'jogos/' : '';

        Object.keys(root).forEach(key => {
            const item = root[key];
            
            // Extrai o nome ignorando se é objeto ou string
            let nomeFinal = "";
            let likesFinal = 0;

            if (typeof item === 'object' && item !== null) {
                nomeFinal = item.nome || item.name || item.title || "Jogo sem Nome";
                likesFinal = item.likes || 0;
            } else {
                nomeFinal = item; // Era uma string pura
                likesFinal = 0;
            }

            listDiv.innerHTML += `
                <div class="game-card">
                    <div class="game-info">
                        <b>${nomeFinal}</b>
                        <div class="likes-count">👍 ${likesFinal} LIKES</div>
                        <br><span>ID: ${key}</span>
                    </div>
                    <div class="actions">
                        <button class="btn-edit" onclick="prepararEdicao('${key}', '${nomeFinal}', '${prefix}')">✏️</button>
                        <button class="btn-del" onclick="remover('${prefix}${key}')">🗑️</button>
                    </div>
                </div>
            `;
        });
    });

    // 2. GRAVAÇÃO COMPLETA (Postar e Editar)
    window.salvarBruto = function() {
        const inputNome = document.getElementById('nomeJogo');
        const key = document.getElementById('keyAtual').value;

        if (!inputNome.value) return alert("Digite o nome do jogo!");

        const objetoJogo = {
            nome: inputNome.value,
            likes: 0,
            data: new Date().getTime()
        };

        if (key) {
            // EDITAR: Usa o SET para limpar o JSON antigo e colocar o novo
            db.ref(key).set(objetoJogo).then(() => {
                alert("JOGO ATUALIZADO!");
                resetar();
            });
        } else {
            // POSTAR NOVO: Força a criação dentro da pasta 'jogos'
            db.ref('jogos').push(objetoJogo).then(() => {
                inputNome.value = "";
                alert("NOVO JOGO POSTADO!");
            }).catch(() => {
                // Se falhar, tenta postar na raiz
                db.ref().push(objetoJogo);
            });
        }
    };

    window.remover = (caminho) => {
        if(confirm("Deseja mesmo deletar?")) {
            db.ref(caminho).remove();
        }
    };

    window.prepararEdicao = (key, nome, prefix) => {
        document.getElementById('keyAtual').value = prefix + key;
        document.getElementById('nomeJogo').value = nome;
        document.getElementById('btnMain').innerText = "ATUALIZAR JOGO AGORA";
        document.getElementById('btnMain').style.background = "#0088ff";
        window.scrollTo(0,0);
    };

    function resetar() {
        document.getElementById('keyAtual').value = "";
        document.getElementById('nomeJogo').value = "";
        document.getElementById('btnMain').innerText = "GRAVAR NO BANCO DE DADOS";
        document.getElementById('btnMain').style.background = "var(--cor-neon)";
    }
</script>
</body>
</html>
