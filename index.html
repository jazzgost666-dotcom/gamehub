<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>NexusHub | LIMPEZA AUTOMÁTICA</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000; color: #ff0000; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .status-box { border: 2px solid #ff0000; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 0 20px #ff0000; }
        .btn-auto { background: #ff0000; color: #fff; border: none; padding: 20px 40px; font-size: 20px; font-weight: bold; border-radius: 10px; cursor: pointer; text-transform: uppercase; margin-top: 20px; }
        .btn-auto.active { background: #00ff00; color: #000; box-shadow: 0 0 20px #00ff00; }
        #log { margin-top: 20px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

    <div class="status-box">
        <h1 id="txtStatus">MODO FAXINA: DESATIVADO</h1>
        <button id="btnPower" class="btn-auto" onclick="toggleLimpeza()">Ativar Limpeza Infinita</button>
        <div id="log">Aguardando comando...</div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBZTuu5I2FNx4ky1UcVohro_Ri_yo3YQfs",
        databaseURL: "https://nexushub-b9667-default-rtdb.firebaseio.com",
        projectId: "nexushub-b9667",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let limpando = false;

    function toggleLimpeza() {
        limpando = !limpando;
        const btn = document.getElementById('btnPower');
        const status = document.getElementById('txtStatus');
        const log = document.getElementById('log');

        if (limpando) {
            btn.innerText = "Limpeza Ativada (Rodando...)";
            btn.classList.add('active');
            status.innerText = "MODO FAXINA: ATIVO 24H";
            status.style.color = "#00ff00";
            iniciarEscaneamento();
        } else {
            btn.innerText = "Ativar Limpeza Infinita";
            btn.classList.remove('active');
            status.innerText = "MODO FAXINA: DESATIVADO";
            status.style.color = "#ff0000";
            db.ref('games').off(); // Para de ouvir o banco
            log.innerText = "Faxina interrompida.";
        }
    }

    function iniciarEscaneamento() {
        const log = document.getElementById('log');
        
        // Sempre que entrar algo novo na pasta 'games'
        db.ref('games').on('child_added', (snapshot) => {
            if (limpando) {
                const id = snapshot.key;
                db.ref('games/' + id).remove()
                    .then(() => {
                        log.innerText = "Detectado e Apagado: " + id + " [" + new Date().toLocaleTimeString() + "]";
                    });
            }
        });
    }
</script>
</body>
</html>
