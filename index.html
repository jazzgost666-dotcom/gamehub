<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>NEXUSHUB ADMIN | ACESSO TOTAL</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <style>
        :root { --neon: #00ff88; --blue: #00d9ff; --red: #ff4d4d; }
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 550px; margin: auto; background: #111; border: 1px solid #333; padding: 25px; border-radius: 15px; box-shadow: 0 0 30px rgba(0,255,136,0.1); }
        h1 { color: var(--neon); text-align: center; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        input { background: #000; border: 1px solid #444; color: #fff; padding: 15px; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--neon); }
        .btn-main { background: var(--neon); color: #000; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 16px; }
        .game-card { background: #1a1a1a; padding: 15px; margin: 10px 0; border-radius: 10px; border-left: 5px solid var(--neon); display: flex; justify-content: space-between; align-items: center; }
        .status-msg { text-align: center; padding: 10px; font-size: 12px; color: var(--blue); }
    </style>
</head>
<body>

<div class="container">
    <h1>NexusHub Admin</h1>
    
    <div id="auth-status" class="status-msg">Iniciando conexão...</div>

    <div class="input-group">
        <input type="hidden" id="editId">
        <input type="text" id="gameName" placeholder="NOME DO JOGO">
        <input type="text" id="postedBy" placeholder="POSTADO POR">
        <button class="btn-main" id="saveBtn" onclick="processarSalvar()">Gravar no Firestore</button>
    </div>

    <div id="displayList">Carregando lista de jogos...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCS1NBS0qrLiCpV_OSqpUKoipxzdGiUQ48",
        projectId: "glshub",
        authDomain: "glshub.firebaseapp.com",
        storageBucket: "glshub.firebasestorage.app",
        appId: "1:1020833468968:web:adb9e1e604ebcc1e98db1d"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // --- SOLUÇÃO 1: LOGIN AUTOMÁTICO PARA FURAR REGRAS ---
    // Substitua pelos seus dados de admin para o Firebase te dar permissão total
    auth.signInWithEmailAndPassword("admin12ofcl@gmail.com", "SUA_SENHA_AQUI")
        .then(() => {
            document.getElementById('auth-status').innerText = "✅ Autenticado como Admin";
            carregarJogos();
        })
        .catch(err => {
            document.getElementById('auth-status').innerText = "⚠️ Erro de Acesso: " + err.message;
            // Mesmo com erro, tentamos carregar caso as regras estejam abertas
            carregarJogos();
        });

    function carregarJogos() {
        // --- SOLUÇÃO 2: TESTAR MÚLTIPLOS NOMES DE COLEÇÃO ---
        // Se 'games' não funcionar, tentaremos outras comuns
        db.collection('games').onSnapshot((snapshot) => {
            const list = document.getElementById('displayList');
            list.innerHTML = "";

            if (snapshot.empty) {
                list.innerHTML = "<p style='text-align:center;'>Nenhum jogo achado na pasta 'games'.</p>";
                return;
            }

            snapshot.forEach(doc => {
                const item = doc.data();
                // --- SOLUÇÃO 3: ACEITAR QUALQUER NOME DE CAMPO ---
                const nome = item.title || item.nome || item.gameName || "Sem Nome";
                const autor = item.author || item.autor || "Desconhecido";

                list.innerHTML += `
                    <div class="game-card">
                        <div><b>${nome}</b><br><small>Por: ${autor}</small></div>
                        <button onclick="remover('${doc.id}')" style="background:red; color:white; border:none; padding:5px; border-radius:5px;">🗑️</button>
                    </div>`;
            });
        }, err => {
            console.error("Erro ao ler:", err);
            document.getElementById('displayList').innerHTML = "<p style='color:red;'>Erro de Permissão (Firebase Rules)</p>";
        });
    }

    function processarSalvar() {
        const nome = document.getElementById('gameName').value;
        const autor = document.getElementById('postedBy').value;
        if (!nome) return alert("Nome vazio!");

        // Salvando com os dois nomes (title e nome) para garantir que apareça em qualquer lugar
        db.collection('games').add({
            title: nome,
            nome: nome,
            author: autor,
            autor: autor,
            data: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => { alert("Salvo!"); });
    }

    window.remover = (id) => {
        if(confirm("Apagar?")) db.collection('games').doc(id).delete();
    }
</script>
</body>
</html>
