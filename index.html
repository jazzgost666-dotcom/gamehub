<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>NexusHub | Recuperação Total</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; }
        .painel { border: 2px solid #00ff00; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px #00ff00; }
        .jogo-item { background: #1a1a1a; border: 1px solid #333; margin: 10px 0; padding: 15px; border-radius: 8px; }
        .controles { display: flex; gap: 10px; margin-top: 10px; }
        input { background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 10px; width: 250px; }
        button { cursor: pointer; padding: 8px 15px; font-weight: bold; border: none; border-radius: 4px; }
        .btn-del { background: #ff0000; color: white; }
        .btn-edit { background: #0088ff; color: white; }
        .btn-save { background: #00ff00; color: black; font-size: 1.2em; }
        .debug-info { color: #888; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="painel">
    <h1>NEXUSHUB - RECONEXÃO FORÇADA</h1>
    <div id="status">📡 Buscando dados em todas as pastas...</div>
    <hr>
    
    <div style="margin: 20px 0;">
        <input type="hidden" id="keyAtual">
        <input type="hidden" id="pathAtual">
        <input type="text" id="nomeInput" placeholder="NOME DO JOGO">
        <button class="btn-save" onclick="salvarAlteracao()">SALVAR / ATUALIZAR</button>
    </div>

    <div id="listaCompleta">
        </div>
</div>

<script>
    const config = {
        apiKey: "AIzaSyBZTuu5I2FNx4ky1UcVohro_Ri_yo3YQfs",
        databaseURL: "https://nexushub-b9667-default-rtdb.firebaseio.com",
        projectId: "nexushub-b9667",
    };

    firebase.initializeApp(config);
    const db = firebase.database();

    // 1. VARREDURA TOTAL (Lê a raiz '/' para não perder nada)
    db.ref('/').on('value', (snapshot) => {
        const display = document.getElementById('listaCompleta');
        display.innerHTML = "";
        document.getElementById('status').innerText = "✅ DADOS SINCRONIZADOS";
        
        const tudo = snapshot.val();
        console.log("Banco Completo:", tudo);

        if (!tudo) {
            display.innerHTML = "<h3>O banco está totalmente vazio.</h3>";
            return;
        }

        // Função para desenhar os itens na tela
        function renderItem(id, data, path) {
            const nome = data.nome || data.title || (typeof data === 'string' ? data : "Objeto sem nome");
            const likes = data.likes || 0;

            const html = `
                <div class="jogo-item">
                    <div>
                        <strong>NOME:</strong> ${nome} <br>
                        <span class="debug-info">Caminho: ${path}/${id}</span>
                    </div>
                    <div class="controles">
                        <button class="btn-edit" onclick="prepararEdicao('${id}', '${nome}', '${path}')">✏️ EDITAR</button>
                        <button class="btn-del" onclick="apagarItem('${id}', '${path}')">🗑️ APAGAR</button>
                        <button style="background:#444; color:white">❤️ ${likes}</button>
                    </div>
                </div>
            `;
            display.innerHTML += html;
        }

        // Procura em 'jogos', em 'games' ou na raiz
        if (tudo.jogos) {
            Object.keys(tudo.jogos).forEach(key => renderItem(key, tudo.jogos[key], 'jogos'));
        } else if (tudo.games) {
            Object.keys(tudo.games).forEach(key => renderItem(key, tudo.games[key], 'games'));
        } else {
            // Se os dados estão soltos na raiz
            Object.keys(tudo).forEach(key => {
                if (typeof tudo[key] === 'object' || typeof tudo[key] === 'string') {
                    renderItem(key, tudo[key], '');
                }
            });
        }
    });

    // 2. FUNÇÃO SALVAR/EDITAR DINÂMICA
    window.salvarAlteracao = function() {
        const nome = document.getElementById('nomeInput').value;
        const key = document.getElementById('keyAtual').value;
        const path = document.getElementById('pathAtual').value || 'jogos'; // padrão é 'jogos'

        if (!nome) return alert("Digite o nome!");

        if (key) {
            // EDITAR existente
            db.ref(path + '/' + key).update({ nome: nome })
              .then(() => alert("Atualizado!"))
              .catch(e => alert("Erro: " + e.message));
        } else {
            // CRIAR novo (Sempre cria em 'jogos' para organizar)
            db.ref('jogos').push({
                nome: nome,
                likes: 0,
                timestamp: Date.now()
            });
        }
        
        // Limpar campos
        document.getElementById('nomeInput').value = "";
        document.getElementById('keyAtual').value = "";
    };

    // 3. PREPARAR EDIÇÃO
    window.prepararEdicao = function(key, nome, path) {
        document.getElementById('nomeInput').value = nome;
        document.getElementById('keyAtual').value = key;
        document.getElementById('pathAtual').value = path;
        window.scrollTo(0,0);
        document.getElementById('nomeInput').focus();
    };

    // 4. APAGAR
    window.apagarItem = function(key, path) {
        if (confirm("TEM CERTEZA? Isso não tem volta!")) {
            const refPath = path ? path + '/' + key : key;
            db.ref(refPath).remove();
        }
    };
</script>

</body>
</html>
