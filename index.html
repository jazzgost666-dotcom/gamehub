<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>NEXUSHUB ADMIN - VERSÃO CORRIGIDA</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #0a0a0b; color: #fff; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .admin-panel { width: 100%; max-width: 500px; background: #16161a; padding: 30px; border-radius: 20px; border: 1px solid #333; }
        h1 { color: #00ff88; text-align: center; text-transform: uppercase; font-size: 24px; margin-bottom: 25px; }
        input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #444; background: #000; color: #fff; box-sizing: border-box; }
        .btn-gravar { width: 100%; padding: 15px; background: #00ff88; color: #000; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .card { background: #222; padding: 15px; margin-top: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #00ff88; }
        .card b { font-size: 18px; display: block; }
        .card span { color: #888; font-size: 12px; }
        .btns { display: flex; gap: 10px; }
        .btn-edit { background: #3498db; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }
        .btn-del { background: #e74c3c; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="admin-panel">
    <h1>NEXUSHUB ADMIN</h1>
    
    <input type="hidden" id="keyAtual">
    <input type="text" id="inputNome" placeholder="NOME DO JOGO">
    <button class="btn-gravar" onclick="salvar()">Gravar no Banco</button>

    <div id="listaJogos">Carregando jogos...</div>
</div>

<script>
    // Configuração oficial do seu projeto
    const firebaseConfig = {
        apiKey: "AIzaSyBZTuu5I2FNx4ky1UcVohro_Ri_yo3YQfs",
        databaseURL: "https://nexushub-b9667-default-rtdb.firebaseio.com",
        projectId: "nexushub-b9667",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // LER OS JOGOS
    db.ref('games').on('value', (snapshot) => {
        const list = document.getElementById('listaJogos');
        list.innerHTML = "";
        const data = snapshot.val();

        if (!data) {
            list.innerHTML = "<p style='text-align:center;color:#666'>Nenhum jogo encontrado.</p>";
            return;
        }

        Object.keys(data).forEach(key => {
            const jogo = data[key];
            // TRATAMENTO PARA NÃO DAR UNDEFINED:
            // Tenta pegar 'nome', se não tiver tenta 'name', se não tiver usa o que estiver no campo.
            const nomeMostrar = jogo.nome || jogo.name || (typeof jogo === 'string' ? jogo : "Sem nome");

            list.innerHTML += `
                <div class="card">
                    <div>
                        <b>${nomeMostrar}</b>
                        <span>ID: ${key}</span>
                    </div>
                    <div class="btns">
                        <button class="btn-edit" onclick="prepararEdicao('${key}', '${nomeMostrar}')">✏️</button>
                        <button class="btn-del" onclick="deletar('${key}')">🗑️</button>
                    </div>
                </div>
            `;
        });
    });

    // SALVAR E ATUALIZAR
    function salvar() {
        const nome = document.getElementById('inputNome').value;
        const key = document.getElementById('keyAtual').value;

        if (!nome) return alert("Digite o nome do jogo!");

        if (key) {
            // EDITAR: Força o campo 'nome' para evitar o undefined
            db.ref('games/' + key).update({
                nome: nome
            }).then(() => {
                alert("Jogo Atualizado!");
                limpar();
            });
        } else {
            // ADICIONAR NOVO
            db.ref('games').push({
                nome: nome,
                likes: 0
            }).then(() => {
                alert("Jogo Adicionado!");
                limpar();
            });
        }
    }

    function deletar(key) {
        if(confirm("Deseja apagar?")) {
            db.ref('games/' + key).remove();
        }
    }

    function prepararEdicao(key, nome) {
        document.getElementById('keyAtual').value = key;
        document.getElementById('inputNome').value = nome;
        window.scrollTo(0,0);
    }

    function limpar() {
        document.getElementById('keyAtual').value = "";
        document.getElementById('inputNome').value = "";
    }
</script>
</body>
</html>
