<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NexusHub Admin - Gerenciar Jogos</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        input, button { padding: 10px; margin: 5px 0; }
        .jogo-item { border-bottom: 1px solid #ddd; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-delete { background: #ff4444; color: white; border: none; cursor: pointer; }
        .btn-edit { background: #44aaff; color: white; border: none; cursor: pointer; margin-right: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎮 Painel de Controle - Jogos</h2>
    
    <div id="form-container">
        <input type="hidden" id="jogoId">
        <input type="text" id="nomeJogo" placeholder="Nome do Jogo" style="width: 70%;">
        <button id="btnSalvar" onclick="salvarJogo()">Adicionar Jogo</button>
    </div>

    <hr>

    <div id="listaJogos">
        <p>Carregando jogos...</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Sua configuração
    const firebaseConfig = {
        apiKey: "AIzaSyBZTuu5I2FNx4ky1UcVohro_Ri_yo3YQfs",
        authDomain: "nexushub-b9667.firebaseapp.com",
        databaseURL: "https://nexushub-b9667-default-rtdb.firebaseio.com",
        projectId: "nexushub-b9667",
        storageBucket: "nexushub-b9667.firebasestorage.app",
        messagingSenderId: "491337953014",
        appId: "1:491337953014:web:9db7f2f23fd0c85154c6d7",
        measurementId: "G-X4BVBFRKDP"
    };

    // Inicializa Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const jogosRef = ref(db, 'jogos');

    // --- FUNÇÃO: Salvar ou Atualizar ---
    window.salvarJogo = function() {
        const id = document.getElementById('jogoId').value;
        const nome = document.getElementById('nomeJogo').value;

        if (nome === "") return alert("Digite o nome do jogo!");

        if (id) {
            // Atualizar existente
            update(ref(db, 'jogos/' + id), { nome: nome });
            document.getElementById('btnSalvar').innerText = "Adicionar Jogo";
        } else {
            // Criar novo
            const novoJogoRef = push(jogosRef);
            set(novoJogoRef, { nome: nome });
        }

        document.getElementById('nomeJogo').value = "";
        document.getElementById('jogoId').value = "";
    };

    // --- FUNÇÃO: Ler em Tempo Real ---
    onValue(jogosRef, (snapshot) => {
        const listaDiv = document.getElementById('listaJogos');
        listaDiv.innerHTML = "";
        
        snapshot.forEach((childSnapshot) => {
            const id = childSnapshot.key;
            const dados = childSnapshot.val();

            listaDiv.innerHTML += `
                <div class="jogo-item">
                    <span>${dados.nome}</span>
                    <div>
                        <button class="btn-edit" onclick="prepararEdicao('${id}', '${dados.nome}')">Editar</button>
                        <button class="btn-delete" onclick="removerJogo('${id}')">Excluir</button>
                    </div>
                </div>
            `;
        });
    });

    // --- FUNÇÃO: Deletar ---
    window.removerJogo = function(id) {
        if(confirm("Tem certeza que deseja apagar?")) {
            remove(ref(db, 'jogos/' + id));
        }
    };

    // --- FUNÇÃO: Preparar Edição ---
    window.prepararEdicao = function(id, nome) {
        document.getElementById('jogoId').value = id;
        document.getElementById('nomeJogo').value = nome;
        document.getElementById('btnSalvar').innerText = "Atualizar Jogo";
    };

</script>
</body>
</html>
