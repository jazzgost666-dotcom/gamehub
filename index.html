<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PAINEL DE EMERGÊNCIA</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        .painel { border: 2px solid #0f0; padding: 20px; margin-bottom: 20px; }
        input { background: #222; color: #0f0; border: 1px solid #0f0; padding: 10px; width: 300px; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .jogo-card { border: 1px solid #444; padding: 10px; margin-top: 10px; display: flex; justify-content: space-between; }
        .erro-msg { color: red; font-size: 20px; background: white; padding: 10px; display: none; }
    </style>
</head>
<body>

    <div id="erroStatus" class="erro-msg">ERRO: O BANCO ESTÁ BLOQUEADO PELO CHEFE (PERMISSION DENIED)</div>

    <div class="painel">
        <h1>SISTEMA DE SINCRONIZAÇÃO FORÇADA</h1>
        <p>Status do Banco: <span id="status">CONECTANDO...</span></p>
        
        <input type="text" id="inputNome" placeholder="NOME DO JOGO">
        <button onclick="salvar()">GRAVAR NO FIREBASE</button>
    </div>

    <div class="painel">
        <h3>JOGOS NO BANCO:</h3>
        <div id="lista">Carregando...</div>
    </div>

<script>
    // 1. SUA CONFIGURAÇÃO
    const firebaseConfig = {
        apiKey: "AIzaSyBZTuu5I2FNx4ky1UcVohro_Ri_yo3YQfs",
        authDomain: "nexushub-b9667.firebaseapp.com",
        databaseURL: "https://nexushub-b9667-default-rtdb.firebaseio.com",
        projectId: "nexushub-b9667",
        storageBucket: "nexushub-b9667.firebasestorage.app",
        messagingSenderId: "491337953014",
        appId: "1:491337953014:web:9db7f2f23fd0c85154c6d7",
    };

    // 2. INICIALIZAÇÃO FORÇADA
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 3. FUNÇÃO PARA SALVAR (TENTA SALVAR NA RAIZ E EM 'JOGOS')
    function salvar() {
        const nome = document.getElementById('inputNome').value;
        if(!nome) return alert("Escreva o nome!");

        // Tenta salvar em 'jogos'
        db.ref('jogos').push({
            nome: nome,
            data: new Date().getTime()
        }).then(() => {
            alert("SUCESSO! Gravou em /jogos");
            document.getElementById('inputNome').value = "";
        }).catch(e => {
            console.error(e);
            alert("ERRO AO GRAVAR: " + e.message);
        });
    }

    // 4. FUNÇÃO PARA LER (ESCUTA TUDO)
    // Vamos tentar ler a raiz '/' para ver se o seu chefe colocou os dados em outro lugar
    db.ref('/').on('value', (snapshot) => {
        document.getElementById('status').innerText = "ONLINE ✅";
        document.getElementById('erroStatus').style.display = "none";
        
        const dados = snapshot.val();
        console.log("DADOS RECEBIDOS:", dados);

        const listaDiv = document.getElementById('lista');
        listaDiv.innerHTML = "";

        if (dados) {
            // Se os dados vierem dentro de 'jogos' ou direto na raiz
            const jogos = dados.jogos ? dados.jogos : dados;
            
            Object.keys(jogos).forEach(id => {
                const item = jogos[id];
                // Verifica se é um objeto com nome ou só uma string
                const nomeMostrado = item.nome ? item.nome : JSON.stringify(item);
                
                listaDiv.innerHTML += `
                    <div class="jogo-card">
                        <span>ID: ${id} | <b>${nomeMostrado}</b></span>
                        <button style="background:red" onclick="apagar('${id}')">DELETAR</button>
                    </div>
                `;
            });
        } else {
            listaDiv.innerHTML = "O banco está vazio (vazio mesmo, sem nada).";
        }
    }, (error) => {
        console.error("ERRO DE LEITURA:", error);
        document.getElementById('status').innerText = "BLOQUEADO ❌";
        document.getElementById('erroStatus').style.display = "block";
    });

    // 5. FUNÇÃO PARA APAGAR
    window.apagar = function(id) {
        if(confirm("Apagar?")) {
            db.ref('jogos/' + id).remove()
              .catch(() => db.ref('/' + id).remove()); // tenta apagar na raiz se falhar
        }
    }
</script>

</body>
</html>
