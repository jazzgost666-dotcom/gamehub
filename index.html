<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NexusHub Ultra Sync</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; }
        input { padding: 10px; border-radius: 5px; border: none; width: 200px; }
        button { padding: 10px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        .jogo { background: #252525; padding: 10px; margin: 10px 0; display: flex; justify-content: space-between; border-left: 4px solid #007bff; }
        .erro { color: #ff4444; font-weight: bold; }
        .sucesso { color: #00ff00; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🚀 NexusHub - Painel de Emergência</h2>
        <div id="debug">Status: Tentando conectar...</div>
        <br>
        <input type="text" id="nomeJogo" placeholder="Nome do Jogo">
        <button onclick="enviarDados()">ADICIONAR JOGO</button>
        <button onclick="tentarSincronizarNovamente()" style="background: #555;">FORÇAR RECARGA</button>
    </div>

    <div id="lista" class="box">
        <h3>Lista de Jogos:</h3>
        <div id="display">Carregando...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const config = {
            apiKey: "AIzaSyBZTuu5I2FNx4ky1UcVohro_Ri_yo3YQfs",
            databaseURL: "https://nexushub-b9667-default-rtdb.firebaseio.com",
            projectId: "nexushub-b9667",
        };

        const app = initializeApp(config);
        const db = getDatabase(app);

        // Função de Enviar
        window.enviarDados = function() {
            const nome = document.getElementById('nomeJogo').value;
            if(!nome) return alert("Digite algo!");
            
            // Tentativa via SDK
            push(ref(db, 'jogos'), { nome: nome })
            .then(() => { alert("Enviado!"); document.getElementById('nomeJogo').value = ""; })
            .catch(err => {
                console.error(err);
                // TENTATIVA 2: SE O SDK FALHAR, TENTA VIA REST API (FORÇA BRUTA)
                enviarViaRest(nome);
            });
        }

        // Função de Listar (Tempo Real)
        onValue(ref(db, 'jogos'), (snapshot) => {
            renderizar(snapshot.val());
            document.getElementById('debug').innerHTML = "<span class='sucesso'>Conectado via SDK! ✅</span>";
        }, (error) => {
            document.getElementById('debug').innerHTML = "<span class='erro'>Erro no SDK. Tentando Modo REST...</span>";
            carregarViaRest();
        });

        window.deletar = function(id) {
            remove(ref(db, 'jogos/' + id));
        }

        function renderizar(dados) {
            const display = document.getElementById('display');
            display.innerHTML = "";
            if (!dados) { display.innerHTML = "Banco vazio."; return; }
            
            Object.keys(dados).forEach(id => {
                display.innerHTML += `
                    <div class="jogo">
                        ${dados[id].nome || dados[id]} 
                        <button onclick="deletar('${id}')" style="background:red">X</button>
                    </div>`;
            });
        }

        // TENTATIVA 2: MODO REST (FETCH API) - Ignora o SDK e vai direto na URL
        async function carregarViaRest() {
            try {
                const res = await fetch("https://nexushub-b9667-default-rtdb.firebaseio.com/jogos.json");
                const data = await res.json();
                renderizar(data);
                document.getElementById('debug').innerHTML = "<span class='sucesso'>Conectado via REST! 🌐</span>";
            } catch (e) {
                document.getElementById('debug').innerHTML = "<span class='erro'>FALHA TOTAL: O banco deve estar privado.</span>";
            }
        }

        async function enviarViaRest(nome) {
            await fetch("https://nexushub-b9667-default-rtdb.firebaseio.com/jogos.json", {
                method: 'POST',
                body: JSON.stringify({ nome: nome })
            });
            carregarViaRest();
        }

        window.tentarSincronizarNovamente = () => carregarViaRest();

    </script>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script>
        // Se o seu chefe configurou o Firebase muito antigo, este script v8 pode ser a salvação
        console.log("Sistema de backup v8 carregado.");
    </script>
</body>
</html>
