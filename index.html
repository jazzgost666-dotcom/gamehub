<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SISTEMA DE RECUPERAÇÃO NEXUSHUB</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #1a0000; color: #fff; font-family: monospace; padding: 20px; }
        .alert { background: #ff0000; color: #fff; padding: 15px; font-weight: bold; border: 2px solid #fff; margin-bottom: 20px; }
        .item { background: #000; border: 1px solid #ff0000; padding: 15px; margin: 10px 0; }
        input { background: #333; color: #fff; border: 1px solid #ff0000; padding: 10px; width: 300px; }
        button { padding: 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-update { background: #ff0000; color: #fff; }
        .btn-post { background: #fff; color: #000; margin-top: 10px; padding: 15px; width: 320px; }
        .raw-data { color: #aaa; font-size: 11px; word-break: break-all; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="alert">MODO DE SOBREPOSIÇÃO ATIVADO: SE O NOME NÃO APARECE, DIGITE E CLIQUE EM "FORÇAR NOME"</div>

    <div style="border: 2px solid #fff; padding: 20px; margin-bottom: 20px;">
        <h3>POSTAR NOVO JOGO (FORÇA BRUTA)</h3>
        <input type="text" id="novoNome" placeholder="NOME DO JOGO">
        <br>
        <button class="btn-post" onclick="postarNovo()">POSTAR NA RAIZ DO BANCO</button>
    </div>

    <div id="listaTotal">Carregando estrutura do banco...</div>

<script>
    const config = {
        apiKey: "AIzaSyBZTuu5I2FNx4ky1UcVohro_Ri_yo3YQfs",
        databaseURL: "https://nexushub-b9667-default-rtdb.firebaseio.com",
        projectId: "nexushub-b9667"
    };

    firebase.initializeApp(config);
    const db = firebase.database();

    // 1. SCANNER TOTAL
    db.ref('/').on('value', (snapshot) => {
        const div = document.getElementById('listaTotal');
        div.innerHTML = "<h2>ITENS DETECTADOS NO BANCO:</h2>";
        const data = snapshot.val();

        if (!data) {
            div.innerHTML += "BANCO VAZIO OU SEM PERMISSÃO DE LEITURA.";
            return;
        }

        // Função para varrer tudo sem erro
        Object.keys(data).forEach(key => {
            const valor = data[key];
            
            // Se o valor for um objeto, tenta pegar o nome dentro dele
            let nomeAtual = "DESCONHECIDO / VAZIO";
            if (typeof valor === 'string') nomeAtual = valor;
            else if (valor && typeof valor === 'object') {
                nomeAtual = valor.nome || valor.title || valor.name || "OBJETO SEM CAMPO NOME";
            }

            div.innerHTML += `
                <div class="item">
                    <div><strong>ID:</strong> ${key}</div>
                    <div><strong>NOME ATUAL:</strong> <span style="color:#0f0">${nomeAtual}</span></div>
                    <div class="raw-data">DADO BRUTO: ${JSON.stringify(valor)}</div>
                    <div style="margin-top:10px">
                        <input type="text" id="input-${key}" placeholder="Novo nome para este ID">
                        <button class="btn-update" onclick="forcarUpdate('${key}')">FORÇAR NOME</button>
                        <button onclick="apagar('${key}')">APAGAR</button>
                    </div>
                </div>
            `;
        });
    });

    // 2. FORÇAR UPDATE (Muda o nome de algo que já existe)
    window.forcarUpdate = function(id) {
        const novoValor = document.getElementById('input-' + id).value;
        if (!novoValor) return alert("Digite o nome para forçar!");

        // Se o deletar funciona, o SET tem que funcionar!
        db.ref(id).set({
            nome: novoValor,
            likes: 0
        }).then(() => alert("FORÇADO COM SUCESSO!"))
          .catch(e => alert("ERRO: " + e.message));
    };

    // 3. POSTAR NOVO (Cria um novo ID na raiz)
    window.postarNovo = function() {
        const nome = document.getElementById('novoNome').value;
        if (!nome) return alert("Digite o nome!");

        // Tenta postar direto na raiz para não errar o caminho
        db.ref().push({
            nome: nome,
            likes: 0
        }).then(() => {
            alert("POSTADO!");
            document.getElementById('novoNome').value = "";
        }).catch(e => alert("ERRO AO POSTAR: " + e.message));
    };

    // 4. APAGAR (O que você disse que funciona)
    window.apagar = function(id) {
        if(confirm("DELETAR?")) {
            db.ref(id).remove();
        }
    };
</script>
</body>
</html>
