<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  /* Estilo do Botão */
  .botao-curso {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh; /* Centraliza na tela toda */
    background-color: #f0f2f5;
    font-family: sans-serif;
  }

  .btn {
    background: linear-gradient(135deg, #2563eb, #1d4ed8); /* Azul do seu tema */
    color: white;
    padding: 20px 40px;
    font-size: 1.5rem;
    font-weight: bold;
    text-decoration: none;
    border-radius: 50px;
    box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .btn:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(37, 99, 235, 0.4);
  }
</style>
</head>
<body>

<div class="botao-curso">
  <a href="https://dashboard.kiwify.com.br/" class="btn" target="_blank">
    ▶ Acessar Meu Curso Completo
  </a>
</div>

</body>
</html>
