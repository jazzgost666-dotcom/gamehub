<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>NexusHub | Admin Full</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --green: #00ff88; --bg: #121212; --card: #1e1e1e; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .form-box { background: var(--card); padding: 20px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; }
        input { background: #2a2a2a; border: 1px solid #444; color: white; padding: 12px; border-radius: 5px; width: 250px; margin-right: 10px; }
        button { padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add { background: var(--green); color: black; }
        .jogo-card { background: var(--card); padding: 20px; margin-bottom: 15px; border-radius: 10px; border-left: 5px solid var(--green); }
        .actions { margin-top: 15px; display: flex; gap: 10px; align-items: center; }
        .btn-del { background: #ff4444; color: white; }
        .btn-like { background: #444; color: white; }
        .comment-section { margin-top: 15px; background: #252525; padding: 10px; border-radius: 5px; font-size: 0.9em; }
        .comment-input { width: 70%; padding: 5px; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 Painel NexusHub Pro</h1>
    
    <div class="form-box">
        <input type="hidden" id="editId">
        <input type="text" id="jogoNome" placeholder="Nome do Jogo...">
        <button id="btnSalvar" class="btn-add" onclick="salvarJogo()">ADICIONAR JOGO</button>
    </div>

    <div id="listaJogos">
        </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBZTuu5I2FNx4ky1UcVohro_Ri_yo3YQfs",
        authDomain: "nexushub-b9667.firebaseapp.com",
        databaseURL: "https://nexushub-b9667-default-rtdb.firebaseio.com",
        projectId: "nexushub-b9667",
        storageBucket: "nexushub-b9667.firebasestorage.app",
        messagingSenderId: "491337953014",
        appId: "1:491337953014:web:9db7f2f23fd0c85154c6d7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- FUNÇÃO: SALVAR / EDITAR ---
    function salvarJogo() {
        const nome = document.getElementById('jogoNome').value;
        const id = document.getElementById('editId').value;
        
        if(!nome) return alert("Digite o nome!");

        if(id) {
            // EDITAR
            db.ref('jogos/' + id).update({ nome: nome });
            resetForm();
        } else {
            // NOVO JOGO
            db.ref('jogos').push({
                nome: nome,
                likes: 0,
                comentarios: ["Primeiro comentário!"]
            });
            document.getElementById('jogoNome').value = "";
        }
    }

    // --- FUNÇÃO: LER EM TEMPO REAL (NÃO APAGA O QUE JÁ EXISTE) ---
    db.ref('jogos').on('value', (snapshot) => {
        const listaDiv = document.getElementById('listaJogos');
        listaDiv.innerHTML = ""; // Limpa a tela para re-renderizar sem duplicar
        
        snapshot.forEach((child) => {
            const jogo = child.val();
            const id = child.key;
            const comentariosHtml = (jogo.comentarios || []).map(c => `<div>• ${c}</div>`).join('');

            listaDiv.innerHTML += `
                <div class="jogo-card">
                    <h2>${jogo.nome}</h2>
                    <div class="actions">
                        <button class="btn-like" onclick="darLike('${id}', ${jogo.likes || 0})">❤️ ${jogo.likes || 0}</button>
                        <button style="background:#007bff; color:white;" onclick="prepararEdicao('${id}', '${jogo.nome}')">✏️ Editar</button>
                        <button class="btn-del" onclick="remover('${id}')">🗑️ Apagar</button>
                    </div>

                    <div class="comment-section">
                        <strong>Comentários:</strong>
                        ${comentariosHtml}
                        <div style="margin-top:10px">
                            <input type="text" id="com-in-${id}" class="comment-input" placeholder="Escreva um comentário...">
                            <button onclick="addComentario('${id}')">Enviar</button>
                        </div>
                    </div>
                </div>
            `;
        });
    });

    // --- FUNÇÕES DE INTERAÇÃO ---
    window.darLike = (id, likesAtuais) => {
        db.ref('jogos/' + id).update({ likes: likesAtuais + 1 });
    };

    window.addComentario = (id) => {
        const input = document.getElementById(`com-in-${id}`);
        if(!input.value) return;
        
        db.ref('jogos/' + id).once('value', snapshot => {
            let j = snapshot.val();
            let lista = j.comentarios || [];
            lista.push(input.value);
            db.ref('jogos/' + id).update({ comentarios: lista });
            input.value = "";
        });
    };

    window.remover = (id) => {
        if(confirm("Deseja apagar este jogo e todos os dados dele?")) {
            db.ref('jogos/' + id).remove();
        }
    };

    window.prepararEdicao = (id, nome) => {
        document.getElementById('editId').value = id;
        document.getElementById('jogoNome').value = nome;
        document.getElementById('btnSalvar').innerText = "ATUALIZAR";
        window.scrollTo(0,0);
    };

    function resetForm() {
        document.getElementById('editId').value = "";
        document.getElementById('jogoNome').value = "";
        document.getElementById('btnSalvar').innerText = "ADICIONAR JOGO";
    }
</script>
</body>
</html>
