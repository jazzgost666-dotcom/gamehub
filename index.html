<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NexusHub Admin | DEBUG MODE</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: monospace; padding: 20px; }
        .admin-box { max-width: 700px; margin: auto; border: 1px solid #0f0; padding: 20px; }
        .game-card { background: #111; border: 1px solid #333; padding: 15px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .data-raw { font-size: 10px; color: #888; margin-top: 5px; }
        input { background: #222; color: #0f0; border: 1px solid #0f0; padding: 10px; width: 60%; }
        button { padding: 10px; cursor: pointer; border: none; font-weight: bold; }
        .btn-add { background: #0f0; color: #000; }
        .btn-del { background: #f00; color: #fff; }
        .btn-edit { background: #00f; color: #fff; }
        h2 { border-bottom: 2px solid #0f0; padding-bottom: 10px; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2>NEXUSHUB - MODO FORÇA BRUTA</h2>
    <div id="status">Status: Sincronizando...</div>
    
    <div style="margin: 20px 0;">
        <input type="hidden" id="editKey">
        <input type="text" id="gameInput" placeholder="NOME DO JOGO">
        <button class="btn-add" onclick="saveData()">SALVAR / POSTAR</button>
    </div>

    <div id="gameList">Buscando na database...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBZTuu5I2FNx4ky1UcVohro_Ri_yo3YQfs",
        databaseURL: "https://nexushub-b9667-default-rtdb.firebaseio.com",
        projectId: "nexushub-b9667",
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. LEITURA UNIVERSAL - MOSTRA TUDO QUE EXISTIR
    db.ref('/').on('value', (snapshot) => {
        const list = document.getElementById('gameList');
        list.innerHTML = "";
        const data = snapshot.val();
        document.getElementById('status').innerText = "Status: Conectado ✅";

        if (!data) {
            list.innerHTML = "O Banco está vazio.";
            return;
        }

        // Função recursiva para achar o nome em qualquer lugar do objeto
        function findName(obj) {
            if (typeof obj === 'string') return obj;
            if (typeof obj !== 'object' || obj === null) return "Sem nome";
            return obj.nome || obj.name || obj.title || obj.jogo || obj.label || Object.values(obj)[0];
        }

        // Tenta detectar se a lista está em 'jogos' ou na raiz
        const root = data.jogos ? data.jogos : data;
        const prefix = data.jogos ? 'jogos/' : '';

        Object.keys(root).forEach(key => {
            const val = root[key];
            const name = findName(val);
            const rawData = JSON.stringify(val); // Mostra o dado real pra gente saber o erro

            list.innerHTML += `
                <div class="game-card">
                    <div>
                        <strong>${name}</strong>
                        <div class="data-raw">RAW: ${rawData}</div>
                        <small style="color:yellow">ID: ${key}</small>
                    </div>
                    <div>
                        <button class="btn-edit" onclick="prepareEdit('${key}', '${name}', '${prefix}')">✏️</button>
                        <button class="btn-del" onclick="deleteGame('${prefix}${key}')">🗑️</button>
                    </div>
                </div>
            `;
        });
    }, (error) => {
        document.getElementById('status').innerText = "ERRO: " + error.message;
    });

    // 2. GRAVAÇÃO DE "SOBREPOSIÇÃO" (Resolve o Adicionar e Editar)
    window.saveData = function() {
        const input = document.getElementById('gameInput');
        const key = document.getElementById('editKey').value;
        
        if (!input.value) return alert("Digite algo!");

        if (key) {
            // EDITAR: Usa SET para forçar a escrita por cima de tudo
            db.ref(key).set({
                nome: input.value,
                likes: 0
            }).then(() => {
                alert("Atualizado com sucesso!");
                resetForm();
            });
        } else {
            // ADICIONAR: Tenta postar na pasta 'jogos' que é o padrão
            db.ref('jogos').push({
                nome: input.value,
                likes: 0
            }).then(() => {
                input.value = "";
                alert("Postado com sucesso!");
            });
        }
    }

    window.deleteGame = (path) => {
        if(confirm("Deseja apagar?")) db.ref(path).remove();
    }

    window.prepareEdit = (key, name, prefix) => {
        document.getElementById('editKey').value = prefix + key;
        document.getElementById('gameInput').value = name;
        window.scrollTo(0,0);
    }

    function resetForm() {
        document.getElementById('editKey').value = "";
        document.getElementById('gameInput').value = "";
    }
</script>
</body>
</html>
