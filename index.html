<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>NexusHub | Modo Full Access</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #0a0a0b; color: #fff; font-family: sans-serif; padding: 20px; }
        .admin-box { max-width: 600px; margin: auto; background: #16161a; padding: 25px; border-radius: 15px; border: 1px solid #333; }
        .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; }
        button { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .btn-add { background: #00ff88; color: #000; width: 100%; margin-top: 10px; }
        .game-card { background: #222; padding: 15px; margin: 10px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #00ff88; }
        .btn-del { background: #ff4d4d; color: white; margin-left: 5px; }
        .btn-edit { background: #2d9cdb; color: white; }
        small { color: #888; display: block; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2>⚡ NEXUSHUB ADMIN</h2>
    <div class="input-row" style="flex-direction: column;">
        <input type="hidden" id="editKey">
        <input type="text" id="gameInput" placeholder="Digite o nome do jogo aqui...">
        <button class="btn-add" id="mainBtn" onclick="saveData()">ADICIONAR / SALVAR JOGO</button>
    </div>

    <div id="gameList">Caminhando nos arquivos...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBZTuu5I2FNx4ky1UcVohro_Ri_yo3YQfs",
        databaseURL: "https://nexushub-b9667-default-rtdb.firebaseio.com",
        projectId: "nexushub-b9667",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. LEITURA UNIVERSAL (Lê String ou Objeto)
    db.ref('/').on('value', (snapshot) => {
        const list = document.getElementById('gameList');
        list.innerHTML = "";
        const data = snapshot.val();

        if (!data) {
            list.innerHTML = "Banco vazio.";
            return;
        }

        // Se houver uma pasta 'jogos', foca nela, senão lê a raiz
        const root = data.jogos ? data.jogos : data;
        const prefix = data.jogos ? 'jogos/' : '';

        Object.keys(root).forEach(key => {
            const val = root[key];
            
            // LÓGICA DE NOME: Se for objeto pega .nome, se for string usa o valor direto
            let nameToShow = "";
            if (typeof val === 'object' && val !== null) {
                nameToShow = val.nome || val.title || val.name || "Objeto sem campo 'nome'";
            } else {
                nameToShow = val; // É uma string pura
            }

            list.innerHTML += `
                <div class="game-card">
                    <div>
                        <strong>${nameToShow}</strong>
                        <small>ID: ${key}</small>
                    </div>
                    <div>
                        <button class="btn-edit" onclick="prepareEdit('${key}', '${nameToShow}', '${prefix}')">✏️</button>
                        <button class="btn-del" onclick="deleteGame('${prefix}${key}')">🗑️</button>
                    </div>
                </div>
            `;
        });
    });

    // 2. GRAVAÇÃO "TANQUE DE GUERRA"
    window.saveData = function() {
        const input = document.getElementById('gameInput');
        const key = document.getElementById('editKey').value;
        
        if (!input.value) return alert("Digite algo!");

        if (key) {
            // EDITAR: Tenta atualizar como objeto. Se o banco recusar, salva como texto.
            db.ref(key).set({
                nome: input.value,
                lastUpdate: Date.now()
            }).then(() => resetForm());
        } else {
            // ADICIONAR: Sempre cria dentro de 'jogos' para organizar
            db.ref('jogos').push({
                nome: input.value,
                likes: 0
            }).then(() => {
                input.value = "";
                alert("Jogo enviado!");
            }).catch(() => {
                // Se o chefe bloqueou a pasta 'jogos', tenta salvar na raiz
                db.ref().push(input.value);
            });
        }
    }

    window.deleteGame = (path) => {
        if(confirm("Apagar mesmo?")) db.ref(path).remove();
    }

    window.prepareEdit = (key, name, prefix) => {
        document.getElementById('editKey').value = prefix + key;
        document.getElementById('gameInput').value = name;
        document.getElementById('mainBtn').innerText = "ATUALIZAR JOGO";
        document.getElementById('mainBtn').style.background = "#2d9cdb";
    }

    function resetForm() {
        document.getElementById('editKey').value = "";
        document.getElementById('gameInput').value = "";
        document.getElementById('mainBtn').innerText = "ADICIONAR / SALVAR JOGO";
        document.getElementById('mainBtn').style.background = "#00ff88";
    }
</script>
</body>
</html>
