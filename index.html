<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>GLSHUB | ADMIN PANEL</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --accent: #00d9ff; --bg: #0a0a0b; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #16161a; border: 1px solid #333; padding: 25px; border-radius: 15px; }
        h1 { color: var(--accent); text-align: center; text-transform: uppercase; }
        .input-box { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        input { background: #000; border: 1px solid #444; color: #fff; padding: 15px; border-radius: 8px; }
        button { padding: 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-add { background: var(--accent); color: #000; }
        .game-card { background: #222; padding: 15px; margin: 10px 0; border-radius: 10px; border-left: 4px solid var(--accent); display: flex; justify-content: space-between; align-items: center; }
        .actions { display: flex; gap: 8px; }
        .btn-del { background: #ff4d4d; color: white; }
        .btn-edit { background: #2d9cdb; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>GLSHUB ADMIN</h1>
    <div class="input-box">
        <input type="hidden" id="editKey">
        <input type="text" id="gameInput" placeholder="NOME DO JOGO">
        <button class="btn-add" id="btnAction" onclick="saveGame()">Gravar no Banco</button>
    </div>
    <div id="gameList">Conectando ao projeto glshub...</div>
</div>

<script>
    // CREDENCIAIS ATUALIZADAS GLSHUB
    const firebaseConfig = {
        apiKey: "AIzaSyCS1NBS0qrLiCpV_OSqpUKoipxzdGiUQ48",
        authDomain: "glshub.firebaseapp.com",
        projectId: "glshub",
        storageBucket: "glshub.firebasestorage.app",
        messagingSenderId: "1020833468968",
        appId: "1:1020833468968:web:adb9e1e604ebcc1e98db1d",
        measurementId: "G-1TGK9KLKQL"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // LER JOGOS (Sempre olha para a pasta 'games')
    db.ref('games').on('value', (snapshot) => {
        const list = document.getElementById('gameList');
        list.innerHTML = "";
        const data = snapshot.val();

        if (!data) {
            list.innerHTML = "<p style='color:#666; text-align:center;'>Nenhum jogo encontrado no glshub.</p>";
            return;
        }

        Object.keys(data).forEach(key => {
            const item = data[key];
            const nome = (typeof item === 'object') ? (item.nome || "Sem nome") : item;
            
            list.innerHTML += `
                <div class="game-card">
                    <div><b>${nome}</b><br><small style="color:#555">${key}</small></div>
                    <div class="actions">
                        <button class="btn-edit" onclick="prepareEdit('${key}', '${nome}')">✏️</button>
                        <button class="btn-del" onclick="deleteGame('${key}')">🗑️</button>
                    </div>
                </div>
            `;
        });
    });

    function saveGame() {
        const input = document.getElementById('gameInput');
        const key = document.getElementById('editKey').value;
        if (!input.value) return alert("Digite o nome!");

        const gameData = { nome: input.value, timestamp: Date.now() };

        if (key) {
            db.ref('games/' + key).set(gameData).then(() => { resetForm(); alert("Atualizado!"); });
        } else {
            db.ref('games').push(gameData).then(() => { input.value = ""; alert("Postado!"); });
        }
    }

    window.deleteGame = (key) => {
        if(confirm("Deseja apagar?")) {
            db.ref('games/' + key).remove()
              .then(() => alert("Apagado com sucesso!"))
              .catch(e => alert("ERRO DE PERMISSÃO: Vá no Firebase Console > Realtime Database > Rules e mude para true."));
        }
    }

    window.prepareEdit = (key, nome) => {
        document.getElementById('editKey').value = key;
        document.getElementById('gameInput').value = nome;
        document.getElementById('btnAction').innerText = "Atualizar Jogo";
        window.scrollTo(0,0);
    }

    function resetForm() {
        document.getElementById('editKey').value = "";
        document.getElementById('gameInput').value = "";
        document.getElementById('btnAction').innerText = "Gravar no Banco";
    }
</script>
</body>
</html>
